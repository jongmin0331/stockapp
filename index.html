<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsaengStock - AI Stock Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>InsaengStock</h1>
        <p>AI-Powered Stock Analysis for KOSPI & NASDAQ</p>
    </header>
    <main>
        <div class="loader"></div>
        <section id="kospi-section">
            <h2>KOSPI</h2>
            <div id="kospi-stocks" class="stock-container"></div>
        </section>
        <section id="nasdaq-section">
            <h2>NASDAQ</h2>
            <div id="nasdaq-stocks" class="stock-container"></div>
        </section>
    </main>
    <template id="stock-card-template">
        <div class="stock-card">
            <div class="card-header">
                <h3 class="stock-name"></h3>
                <div class="stock-ticker"></div>
            </div>
            <div class="card-body">
                <div class="metric">
                    <span class="metric-label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-graph-up" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M0 0h1v15h15v1H0V0zm10 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4.9l-3.613 4.417a.5.5 0 0 1-.74.037L7 6.767l-2.06 2.06a.5.5 0 0 1-.708-.708l2.5-2.5a.5.5 0 0 1 .708 0l2.5 2.5a.5.5 0 0 1 0 .708L10.5 10.293V8.5a.5.5 0 0 1 .5-.5z"/>
                        </svg>
                        RSI
                    </span>
                    <span class="metric-value rsi"></span>
                </div>
                <div class="metric">
                    <span class="metric-label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cash" viewBox="0 0 16 16">
                            <path d="M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
                            <path d="M0 4a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V4zm3 0a2 2 0 0 1-2 2v4a2 2 0 0 1 2 2h10a2 2 0 0 1 2-2V6a2 2 0 0 1-2-2H3z"/>
                        </svg>
                        PSR
                    </span>
                    <span class="metric-value psr"></span>
                </div>
                <div class="metric">
                    <span class="metric-label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-book" viewBox="0 0 16 16">
                            <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.492-3.288.884V2.828zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.746c-.918-.392-2.108-.764-3.288-.884-1.095-.11-2.278.036-3.213.493V2.687zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.682 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.81 8.985.936 8 1.783z"/>
                        </svg>
                        PBR
                    </span>
                    <span class="metric-value pbr"></span>
                </div>
                <div class="metric">
                    <span class="metric-label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-up-right" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M14 2.5a.5.5 0 0 0-.5-.5h-6a.5.5 0 0 0 0 1h4.793L2.146 13.146a.5.5 0 0 0 .708.708L13 3.707V8.5a.5.5 0 0 0 1 0v-6z"/>
                        </svg>
                        Sales Growth
                    </span>
                    <span class="metric-value sales-growth"></span>
                </div>
            </div>
            <div class="card-footer">
                <div class="recommendation"></div>
            </div>
        </div>
    </template>
    <script src="main.js" type="module"></script>
</body>
</html>
